<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 644" width="980" height="644" font-family="Helvetica,Arial,sans-serif"><rect width="980" height="644" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#111">From 6.5 to 40.3 tok/s: each step adds one change to all the steps above it</text>
<text x="20" y="48" font-size="12" fill="#555">GLM-5.3-Flash, one user, decode tok/s. Steps were measured on different days and slightly different workloads, so increments are approximate.</text>
<text x="360" y="89" font-size="12.5" fill="#222" text-anchor="end">First deployment (off-the-shelf llama.cpp, 1 GbE)</text>
<rect x="370.0" y="76" width="79.8" height="20" fill="#9aa3ad" rx="2"/>
<text x="455.8" y="91" font-size="12.5" fill="#111" font-weight="bold">6.5</text>
<text x="360" y="131" font-size="12.5" fill="#222" text-anchor="end">+ 10G link + MTP speculative drafting</text>
<line x1="449.8" y1="100" x2="449.8" y2="118" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="449.8" y="118" width="128.9" height="20" fill="#1f6feb" rx="2"/>
<text x="584.6" y="133" font-size="12.5" fill="#111" font-weight="bold">17.0</text>
<text x="622.6" y="133" font-size="12" fill="#1f6feb">+10.5</text>
<text x="360" y="173" font-size="12.5" fill="#222" text-anchor="end">+ our vLLM-based runtime, all experts on CPU</text>
<line x1="578.6" y1="142" x2="578.6" y2="160" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="575.0" y="160" width="3.7" height="20" fill="#9aa3ad" rx="2"/>
<text x="584.6" y="175" font-size="12.5" fill="#111" font-weight="bold">16.7</text>
<text x="622.6" y="175" font-size="12" fill="#777">about the same</text>
<text x="360" y="215" font-size="12.5" fill="#222" text-anchor="end">+ hot experts on the Spark GPU, rest on the CPU</text>
<line x1="575.0" y1="184" x2="575.0" y2="202" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="575.0" y="202" width="72.4" height="20" fill="#1f6feb" rx="2"/>
<text x="653.4" y="217" font-size="12.5" fill="#111" font-weight="bold">22.6</text>
<text x="691.4" y="217" font-size="12" fill="#1f6feb">+5.9</text>
<text x="360" y="257" font-size="12.5" fill="#222" text-anchor="end">+ low-latency link tuning</text>
<line x1="647.4" y1="226" x2="647.4" y2="244" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="647.4" y="244" width="25.8" height="20" fill="#1f6feb" rx="2"/>
<text x="679.1" y="259" font-size="12.5" fill="#111" font-weight="bold">24.7</text>
<text x="717.1" y="259" font-size="12" fill="#1f6feb">+2.1</text>
<text x="360" y="299" font-size="12.5" fill="#222" text-anchor="end">+ skip the weakest expert pick (top-7)</text>
<line x1="673.1" y1="268" x2="673.1" y2="286" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="673.1" y="286" width="20.9" height="20" fill="#1f6feb" rx="2"/>
<text x="700.0" y="301" font-size="12.5" fill="#111" font-weight="bold">26.4</text>
<text x="738.0" y="301" font-size="12" fill="#1f6feb">+1.7</text>
<text x="360" y="341" font-size="12.5" fill="#222" text-anchor="end">+ balance rule (GPU/CPU share per step)</text>
<line x1="694.0" y1="310" x2="694.0" y2="328" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="694.0" y="328" width="11.0" height="20" fill="#1f6feb" rx="2"/>
<text x="711.0" y="343" font-size="12.5" fill="#111" font-weight="bold">27.3</text>
<text x="749.0" y="343" font-size="12" fill="#1f6feb">+0.9</text>
<text x="360" y="383" font-size="12.5" fill="#222" text-anchor="end">+ 4-bit attention</text>
<line x1="705.0" y1="352" x2="705.0" y2="370" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="705.0" y="370" width="28.2" height="20" fill="#1f6feb" rx="2"/>
<text x="739.3" y="385" font-size="12.5" fill="#111" font-weight="bold">29.6</text>
<text x="777.3" y="385" font-size="12" fill="#1f6feb">+2.3</text>
<text x="360" y="425" font-size="12.5" fill="#222" text-anchor="end">+ 4-bit shared experts and dense layers</text>
<line x1="733.3" y1="394" x2="733.3" y2="412" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="733.3" y="412" width="20.9" height="20" fill="#1f6feb" rx="2"/>
<text x="760.1" y="427" font-size="12.5" fill="#111" font-weight="bold">31.3</text>
<text x="798.1" y="427" font-size="12" fill="#1f6feb">+1.7</text>
<text x="360" y="467" font-size="12.5" fill="#222" text-anchor="end">+ top-5, window reuse, mean stand-in</text>
<line x1="754.1" y1="436" x2="754.1" y2="454" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="754.1" y="454" width="60.1" height="20" fill="#1f6feb" rx="2"/>
<text x="820.3" y="469" font-size="12.5" fill="#111" font-weight="bold">36.2</text>
<text x="858.3" y="469" font-size="12" fill="#1f6feb">+4.9</text>
<text x="360" y="509" font-size="12.5" fill="#222" text-anchor="end">+ top-4</text>
<line x1="814.3" y1="478" x2="814.3" y2="496" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="814.3" y="496" width="23.3" height="20" fill="#1f6feb" rx="2"/>
<text x="843.6" y="511" font-size="12.5" fill="#111" font-weight="bold">38.1</text>
<text x="881.6" y="511" font-size="12" fill="#1f6feb">+1.9</text>
<text x="360" y="551" font-size="12.5" fill="#222" text-anchor="end">+ GPU kernel work</text>
<line x1="837.6" y1="520" x2="837.6" y2="538" stroke="#bbb" stroke-dasharray="3 3"/>
<rect x="837.6" y="538" width="27.0" height="20" fill="#1e7b3a" rx="2"/>
<text x="870.6" y="553" font-size="12.5" fill="#111" font-weight="bold">40.3</text>
<text x="908.6" y="553" font-size="12" fill="#1f6feb">+2.2</text>
<line x1="370.0" y1="576" x2="370.0" y2="581" stroke="#333"/><text x="370.0" y="595" font-size="11" fill="#444" text-anchor="middle">0</text>
<line x1="492.7" y1="576" x2="492.7" y2="581" stroke="#333"/><text x="492.7" y="595" font-size="11" fill="#444" text-anchor="middle">10</text>
<line x1="615.5" y1="576" x2="615.5" y2="581" stroke="#333"/><text x="615.5" y="595" font-size="11" fill="#444" text-anchor="middle">20</text>
<line x1="738.2" y1="576" x2="738.2" y2="581" stroke="#333"/><text x="738.2" y="595" font-size="11" fill="#444" text-anchor="middle">30</text>
<line x1="860.9" y1="576" x2="860.9" y2="581" stroke="#333"/><text x="860.9" y="595" font-size="11" fill="#444" text-anchor="middle">40</text>
<line x1="370.0" y1="576" x2="910.0" y2="576" stroke="#333"/>
<text x="640.0" y="614" font-size="12.5" fill="#222" text-anchor="middle">decode tok/s (one user). Final: 40.3 tok/s at KL 0.085 vs a Q8 copy of the original BF16 weights</text>
</svg>
