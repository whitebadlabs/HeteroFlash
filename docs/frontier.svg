<text x="88.0" y="192.1" font-size="12" fill="#1e7b3a" text-anchor="start">quality bar: KL 0.1</text>
<line x1="80" y1="80" x2="880" y2="80" stroke="#c0392b" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="7 5"/>
<text x="318.0" y="72.0" font-size="12" fill="#c0392b" text-anchor="start">standard 2-bit build: KL 0.239 (27.5 tok/s), 2.4x the drift of HeteroFlash's fastest</text>
<g><title>Standard 2-bit build: every routed expert in 2 bits (IQ2_XXS), all on the Spark. 27-28 tok/s, KL 0.239.</title><circle cx="263.3" cy="80.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="263.3" cy="80" r="5" fill="#c0392b"/></g>
<g><title>Rejected: 2-bit fallback tier for skipped picks. Better quality (KL 0.053) but slower (about 30 tok/s): the Spark GPU has no spare time.</title><circle cx="346.7" cy="328.2" r="12" fill="#fff" fill-opacity="0"/><circle cx="346.7" cy="328.2" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/></g>
<g><title>Rejected: truncated-expert fallback. KL 0.078 at 37.7 tok/s, a quality gain below the bar we set.</title><circle cx="603.3" cy="259.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="603.3" cy="259.0" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/></g>
<g><title>Top-7: skip each token's weakest expert pick. 26.4 tok/s, KL 0.038.</title><circle cx="226.7" cy="369.8" r="12" fill="#fff" fill-opacity="0"/><circle cx="226.7" cy="369.8" r="5" fill="#fff" stroke="#0b3d91" stroke-width="1.5"/></g>
<g><title>Top-4 before the GPU kernel work: 38.1 tok/s, KL 0.085. Since beaten by top-4 + 2 late.</title><circle cx="616.7" cy="239.6" r="12" fill="#fff" fill-opacity="0"/><circle cx="616.7" cy="239.6" r="5" fill="#fff" stroke="#0b3d91" stroke-width="1.5"/></g>
<polyline fill="none" stroke="#0b3d91" stroke-width="4" stroke-linejoin="round" points="170.0,400.2 256.7,369.8 333.3,331.0 490.0,317.2 553.3,295.0 626.7,272.8 690.0,238.8 770.0,199.2"/>
<g><title>Split by memory + low-latency link: hot experts computed on the Spark GPU, the rest on the workstation CPU next to its own RAM. 24.7 tok/s, KL 0.027.</title><circle cx="170.0" cy="400.2" r="12" fill="#fff" fill-opacity="0"/><circle cx="170.0" cy="400.2" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>Balance rule: decides per step how many experts the GPU takes vs the CPU. 27.3 tok/s, KL 0.038.</title><circle cx="256.7" cy="369.8" r="12" fill="#fff" fill-opacity="0"/><circle cx="256.7" cy="369.8" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>4-bit (NVFP4) attention weights. 29.6 tok/s, KL 0.052.</title><circle cx="333.3" cy="331.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="333.3" cy="331.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-6): 6 of 8 experts per token, plus window reuse and the mean stand-in. 34.3 tok/s, KL 0.057. Measured before the GPU kernel work.</title><circle cx="490.0" cy="317.2" r="12" fill="#fff" fill-opacity="0"/><circle cx="490.0" cy="317.2" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-5): 5 of 8 experts per token, plus window reuse and the mean stand-in. 36.2 tok/s, KL 0.065. Measured before the GPU kernel work.</title><circle cx="553.3" cy="295.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="553.3" cy="295.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash quality setting (top-4 + 2 late): the 4 strongest experts on time, the 5th and 6th computed by the workstation and added one layer later. 38.4 tok/s, KL 0.073; every domain better than plain top-4.</title><circle cx="626.7" cy="272.8" r="12" fill="#fff" fill-opacity="0"/><circle cx="626.7" cy="272.8" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-4): 4 of 8 experts per token plus the GPU kernel work. 40.3 tok/s, KL 0.085. The previous fastest setting.</title><circle cx="690.0" cy="238.8" r="12" fill="#fff" fill-opacity="0"/><circle cx="690.0" cy="238.8" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash fastest (top-3 + 2 late): the 3 strongest experts on time, the 4th and 5th computed by the workstation and added one layer later, so the GPU does not wait for them. 42.7 tok/s, KL 0.0996 (just inside the 0.1 bar), tool calling 90/100.</title><circle cx="770.0" cy="199.2" r="16" fill="#fff" fill-opacity="0"/><circle cx="770.0" cy="199.2" r="16" fill="#cfe0ff"/><circle cx="770.0" cy="199.2" r="9" fill="#0b3d91" stroke="#fff" stroke-width="2"/></g>
<text x="158.0" y="422.2" font-size="12" fill="#0b3d91" text-anchor="start">split by memory + link tuning (24.7, 0.027)</text>
<text x="232.7" y="390.8" font-size="12" fill="#0b3d91" text-anchor="start">top-7, then + balance rule (KL 0.038)</text>
<text x="321.3" y="317.0" font-size="12" fill="#0b3d91" text-anchor="end">+ 4-bit attention (29.6, 0.052)</text>
<text x="490.0" y="342.2" font-size="12" fill="#0b3d91" text-anchor="middle" font-weight="bold">HeteroFlash (top-6)</text>
<text x="490.0" y="356.2" font-size="11" fill="#0b3d91" text-anchor="middle">34.3 tok/s, KL 0.057</text>
<text x="567.3" y="323.0" font-size="12" fill="#0b3d91" text-anchor="start" font-weight="bold">HeteroFlash (top-5)</text>
<text x="567.3" y="337.0" font-size="11" fill="#0b3d91" text-anchor="start">36.2 tok/s, KL 0.065</text>
<text x="606.7" y="229.6" font-size="11" fill="#0b3d91" text-anchor="end">38.1 (before kernel work)</text>
<text x="640.7" y="287.8" font-size="12" fill="#0b3d91" text-anchor="start" font-weight="bold">quality setting (top-4 + 2 late)</text>
<text x="640.7" y="301.8" font-size="11" fill="#0b3d91" text-anchor="start">38.4 tok/s, KL 0.073</text>
<text x="704.0" y="249.8" font-size="12" fill="#0b3d91" text-anchor="start" font-weight="bold">HeteroFlash (top-4)</text>
<text x="704.0" y="263.8" font-size="11" fill="#0b3d91" text-anchor="start">40.3 tok/s, KL 0.085</text>
<text x="860.0" y="140.0" font-size="15" fill="#0b3d91" text-anchor="end" font-weight="bold">HeteroFlash fastest (top-3 + 2 late)</text>
<text x="860.0" y="158.0" font-size="13" fill="#0b3d91" text-anchor="end" font-weight="bold">42.7 tok/s, KL 0.0996</text>
