<text x="88.0" y="169.0" font-size="12" fill="#1e7b3a" text-anchor="start">quality bar: KL 0.1</text>
<line x1="80" y1="80" x2="880" y2="80" stroke="#c0392b" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="7 5"/>
<text x="318.0" y="72.0" font-size="12" fill="#c0392b" text-anchor="start">standard 2-bit build: KL 0.239 (27.5 tok/s), 2.8x the drift of HeteroFlash top-4</text>
<g><title>Standard 2-bit build: every routed expert in 2 bits (IQ2_XXS), all on the Spark. 27-28 tok/s, KL 0.239.</title><circle cx="300.0" cy="80.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="300.0" cy="80" r="5" fill="#c0392b"/></g>
<g><title>Rejected: weak picks one layer late. Good quality (KL 0.079) but only about 23 tok/s, because the workstation has no spare bandwidth.</title><circle cx="120.0" cy="238.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="120.0" cy="238.0" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/></g>
<g><title>Rejected: 2-bit fallback tier for skipped picks. Better quality (KL 0.053) but slower (about 30 tok/s): the Spark GPU has no spare time.</title><circle cx="400.0" cy="316.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="400.0" cy="316.0" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/></g>
<g><title>Rejected: truncated-expert fallback. KL 0.078 at 37.7 tok/s, a quality gain below the bar we set.</title><circle cx="708.0" cy="241.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="708.0" cy="241.0" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/></g>
<polyline fill="none" stroke="#0b3d91" stroke-width="4" stroke-linejoin="round" points="188.0,394.0 256.0,361.0 292.0,361.0 384.0,319.0 572.0,304.0 648.0,280.0 724.0,220.0 812.0,219.1"/>
<g><title>Split by memory + low-latency link: hot experts computed on the Spark GPU, the rest on the workstation CPU next to its own RAM. 24.7 tok/s, KL 0.027.</title><circle cx="188.0" cy="394.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="188.0" cy="394.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>Top-7: skip each token's weakest expert pick. 26.4 tok/s, KL 0.038.</title><circle cx="256.0" cy="361.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="256.0" cy="361.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>Balance rule: decides per step how many experts the GPU takes vs the CPU. 27.3 tok/s, KL 0.038.</title><circle cx="292.0" cy="361.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="292.0" cy="361.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>4-bit (NVFP4) attention weights. 29.6 tok/s, KL 0.052.</title><circle cx="384.0" cy="319.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="384.0" cy="319.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-6): 6 of 8 experts per token, plus window reuse and the mean stand-in. 34.3 tok/s, KL 0.057. Measured before the GPU kernel work.</title><circle cx="572.0" cy="304.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="572.0" cy="304.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-5): 5 of 8 experts per token, plus window reuse and the mean stand-in. 36.2 tok/s, KL 0.065. Measured before the GPU kernel work.</title><circle cx="648.0" cy="280.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="648.0" cy="280.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>Top-4 before the GPU kernel work: 38.1 tok/s, KL 0.085.</title><circle cx="724.0" cy="220.0" r="12" fill="#fff" fill-opacity="0"/><circle cx="724.0" cy="220.0" r="6.5" fill="#0b3d91" stroke="#fff" stroke-width="1.5"/></g>
<g><title>HeteroFlash (top-4), current best: 4 of 8 experts per token plus the GPU kernel work. 40.3 tok/s, KL 0.085.</title><circle cx="812.0" cy="219.1" r="16" fill="#fff" fill-opacity="0"/><circle cx="812.0" cy="219.1" r="16" fill="#cfe0ff"/><circle cx="812.0" cy="219.1" r="9" fill="#0b3d91" stroke="#fff" stroke-width="2"/></g>
<text x="176.0" y="416.0" font-size="12" fill="#0b3d91" text-anchor="start">split by memory + link tuning (24.7, 0.027)</text>
<text x="262.0" y="382.0" font-size="12" fill="#0b3d91" text-anchor="start">top-7, then + balance rule (KL 0.038)</text>
<text x="372.0" y="305.0" font-size="12" fill="#0b3d91" text-anchor="end">+ 4-bit attention (29.6, 0.052)</text>
<text x="572.0" y="329.0" font-size="12" fill="#0b3d91" text-anchor="middle" font-weight="bold">HeteroFlash (top-6)</text>
<text x="572.0" y="343.0" font-size="11" fill="#0b3d91" text-anchor="middle">34.3 tok/s, KL 0.057</text>
<text x="662.0" y="290.0" font-size="12" fill="#0b3d91" text-anchor="start" font-weight="bold">HeteroFlash (top-5)</text>
<text x="662.0" y="304.0" font-size="11" fill="#0b3d91" text-anchor="start">36.2 tok/s, KL 0.065</text>
<text x="714.0" y="210.0" font-size="11" fill="#0b3d91" text-anchor="end">38.1 (before kernel work)</text>
<text x="860.0" y="140.0" font-size="15" fill="#0b3d91" text-anchor="end" font-weight="bold">HeteroFlash (top-4)</text>
<text x="860.0" y="158.0" font-size="13" fill="#0b3d91" text-anchor="end" font-weight="bold">40.3 tok/s, KL 0.085</text>
<line x1="812.0" y1="165" x2="812.0" y2="201.1" stroke="#0b3d91" stroke-width="1"/>
<rect x="150" y="188" width="300" height="72" rx="6" fill="#fff" stroke="#ccc"/>
<line x1="160" y1="204" x2="184" y2="204" stroke="#0b3d91" stroke-width="4"/><circle cx="172" cy="204" r="5" fill="#0b3d91"/>
<text x="194.0" y="208.0" font-size="12" fill="#0b3d91" text-anchor="start" font-weight="bold">HeteroFlash: each kept change</text>
<line x1="160" y1="224" x2="184" y2="224" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="194.0" y="228.0" font-size="12" fill="#c0392b" text-anchor="start">standard 2-bit build (reference)</text>
<circle cx="172" cy="244" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
<text x="194.0" y="248.0" font-size="12" fill="#888" text-anchor="start">tried and rejected (hover for details)</text>
<text x="480.0" y="517.0" font-size="14" fill="#222" text-anchor="middle">decode speed (tok/s, one user, higher is better)</text>
<text transform="translate(26 295) rotate(-90)" font-size="14" fill="#222" text-anchor="middle">KL divergence (lower is better)</text>
<text x="80.0" y="547.0" font-size="11" fill="#666" text-anchor="start">Grey: weak picks one layer late, 2-bit fallback tier, truncated experts. Whole-partial deferral (32.5 tok/s, KL 0.44) is off the chart.</text>
<text x="80.0" y="562.0" font-size="11" fill="#666" text-anchor="start">All points except 40.3 were measured before the GPU kernel work. The y axis is broken above KL 0.12.</text>
<text x="80.0" y="577.0" font-size="11" fill="#666" text-anchor="start">Not shown: first deployment 6.5 tok/s; two-GPU server 151 tok/s at KL 0.042.</text>
</svg>
