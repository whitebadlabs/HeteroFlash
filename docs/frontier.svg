<text x="194.0" y="250.0" font-size="12" fill="#c0392b" text-anchor="start">standard 2-bit build (reference)</text>
<circle cx="172" cy="266" r="4" fill="none" stroke="#b8b8b8" stroke-width="1.5"/>
<text x="194.0" y="270.0" font-size="12" fill="#888" text-anchor="start">tried and rejected (hover for details)</text>
<circle cx="172" cy="286" r="5" fill="#fff" stroke="#0b3d91" stroke-width="1.5"/>
<text x="194.0" y="290.0" font-size="12" fill="#0b3d91" text-anchor="start">earlier kept step, since beaten</text>
<text x="480.0" y="517.0" font-size="14" fill="#222" text-anchor="middle">decode speed (tok/s, one user, higher is better)</text>
<text transform="translate(26 295) rotate(-90)" font-size="14" fill="#222" text-anchor="middle">KL divergence (lower is better)</text>
<text x="80.0" y="547.0" font-size="11" fill="#666" text-anchor="start">+ 2 late: the next two experts are computed by the workstation and added one layer later. Grey: 2-bit fallback tier, truncated experts.</text>
<text x="80.0" y="562.0" font-size="11" fill="#666" text-anchor="start">Points up to 38.1 were measured before the GPU kernel work. The y axis is broken above KL 0.13.</text>
<text x="80.0" y="577.0" font-size="11" fill="#666" text-anchor="start">Not shown: whole-partial deferral (32.5 tok/s, KL 0.44); first deployment 6.5 tok/s; two-GPU server 151 tok/s at KL 0.042.</text>
</svg>
