<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Helvetica,Arial,sans-serif">
<rect width="920" height="600" fill="#ffffff"/>
<text x="80.0" y="28.0" font-size="19" fill="#111" text-anchor="start" font-weight="bold">GLM-5.3-Flash on 1 DGX Spark + a workstation CPU: speed vs quality</text>
<text x="80.0" y="48.0" font-size="12.5" fill="#555" text-anchor="start">Decode tok/s for one user vs KL to the original model (Q8 copy of the BF16 weights). Lower-right is better.</text>
<rect x="80" y="175.0" width="800" height="300.0" fill="#f2faf4"/>
<line x1="80.0" y1="475" x2="80.0" y2="115" stroke="#ececec"/>
<text x="80.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">22</text>
<line x1="160.0" y1="475" x2="160.0" y2="115" stroke="#ececec"/>
<text x="160.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">24</text>
<line x1="240.0" y1="475" x2="240.0" y2="115" stroke="#ececec"/>
<text x="240.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">26</text>
<line x1="320.0" y1="475" x2="320.0" y2="115" stroke="#ececec"/>
<text x="320.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">28</text>
<line x1="400.0" y1="475" x2="400.0" y2="115" stroke="#ececec"/>
<text x="400.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">30</text>
<line x1="480.0" y1="475" x2="480.0" y2="115" stroke="#ececec"/>
<text x="480.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">32</text>
<line x1="560.0" y1="475" x2="560.0" y2="115" stroke="#ececec"/>
<text x="560.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">34</text>
<line x1="640.0" y1="475" x2="640.0" y2="115" stroke="#ececec"/>
<text x="640.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">36</text>
<line x1="720.0" y1="475" x2="720.0" y2="115" stroke="#ececec"/>
<text x="720.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">38</text>
<line x1="800.0" y1="475" x2="800.0" y2="115" stroke="#ececec"/>
<text x="800.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">40</text>
<line x1="880.0" y1="475" x2="880.0" y2="115" stroke="#ececec"/>
<text x="880.0" y="493.0" font-size="12" fill="#444" text-anchor="middle">42</text>
<line x1="80" y1="475.0" x2="880" y2="475.0" stroke="#ececec"/>
<text x="72.0" y="479.0" font-size="12" fill="#444" text-anchor="end">0</text>
<line x1="80" y1="415.0" x2="880" y2="415.0" stroke="#ececec"/>
<text x="72.0" y="419.0" font-size="12" fill="#444" text-anchor="end">0.02</text>
<line x1="80" y1="355.0" x2="880" y2="355.0" stroke="#ececec"/>
<text x="72.0" y="359.0" font-size="12" fill="#444" text-anchor="end">0.04</text>
<line x1="80" y1="295.0" x2="880" y2="295.0" stroke="#ececec"/>
<text x="72.0" y="299.0" font-size="12" fill="#444" text-anchor="end">0.06</text>
<line x1="80" y1="235.0" x2="880" y2="235.0" stroke="#ececec"/>
<text x="72.0" y="239.0" font-size="12" fill="#444" text-anchor="end">0.08</text>
<line x1="80" y1="175.0" x2="880" y2="175.0" stroke="#ececec"/>
<text x="72.0" y="179.0" font-size="12" fill="#444" text-anchor="end">0.1</text>
<line x1="80" y1="115.0" x2="880" y2="115.0" stroke="#ececec"/>
<text x="72.0" y="119.0" font-size="12" fill="#444" text-anchor="end">0.12</text>
<text x="72.0" y="84.0" font-size="12" fill="#c0392b" text-anchor="end">0.239</text>
<line x1="80" y1="475" x2="880" y2="475" stroke="#333"/>
<line x1="80" y1="475" x2="80" y2="107" stroke="#333"/>
<line x1="80" y1="72" x2="80" y2="94" stroke="#333"/>
<line x1="73" y1="105" x2="87" y2="97" stroke="#333" stroke-width="1.5"/>
